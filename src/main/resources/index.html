
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="container">

        <h1>Task Management System</h1>

        <div class="form-section">
            <h2>Create Task</h2>

            <input id="title" type="text" placeholder="Task title">
            <input id="description" type="text" placeholder="Task description">

            <label for="userId">Assign task to:</label>
            <select id="userId">
                <option value="">Loading users...</option>
            </select>

            <button onclick="createTask()">Create Task</button>
        </div>

        <div class="form-section">
            <h2>Tasks</h2>

            <label for="userFilter">Filter by assigned user:</label>
            <select id="userFilter" onchange="loadTasks()">
                <option value="">All users</option>
            </select>

            <button onclick="loadTasks()">Refresh Tasks</button>
        </div>

        <div id="message"></div>
        <div id="tasks"></div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const response = await fetch("/api/users");

                if (!response.ok) {
                    throw new Error("Could not load users.");
                }

                const users = await response.json();

                const userSelect = document.getElementById("userId");
                const filterSelect = document.getElementById("userFilter");

                userSelect.innerHTML = '<option value="">Select a user</option>';
                filterSelect.innerHTML = '<option value="">All users</option>';

                users.forEach(user => {
                    const option = document.createElement("option");
                    option.value = user.id;
                    option.textContent = user.username + " (ID: " + user.id + ")";
                    userSelect.appendChild(option);

                    const filterOption = document.createElement("option");
                    filterOption.value = user.id;
                    filterOption.textContent = user.username;
                    filterSelect.appendChild(filterOption);
                });

                if (users.length === 0) {
                    showMessage("No users found. Create a user before assigning tasks.");
                }
            } catch (error) {
                showMessage("Error loading users: " + error.message);
            }
        }

        async function loadTasks() {
            const selectedUser = document.getElementById("userFilter").value;
            let url = "/api/tasks";

            if (selectedUser !== "") {
                url = "/api/tasks/by-user?user_id=" + encodeURIComponent(selectedUser);
            }

            const taskContainer = document.getElementById("tasks");
            taskContainer.replaceChildren();

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Server returned status " + response.status);
                }

                const tasks = await response.json();

                if (tasks.length === 0) {
                    taskContainer.textContent = "No tasks found.";
                    return;
                }

                tasks.forEach(task => {
                    const taskDiv = document.createElement("div");
                    taskDiv.className = "task";

                    const heading = document.createElement("h3");
                    heading.textContent = task.title;

                    const description = document.createElement("p");
                    description.textContent = task.description;

                    const status = document.createElement("p");
                    status.className = "status";
                    status.textContent = "Status: " + task.status;

                    const assignedUser = document.createElement("p");
                    assignedUser.textContent = "User ID: " + task.user_id;

                    const editButton = document.createElement("button");
                    editButton.textContent = "Edit Task";
                    editButton.addEventListener("click", () => {
                        updateTask(task.id, task.title, task.description, task.status);
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.addEventListener("click", () => deleteTask(task.id));

                    taskDiv.append(
                        heading,
                        description,
                        status,
                        assignedUser,
                        editButton,
                        deleteButton
                    );

                    taskContainer.appendChild(taskDiv);
                });
            } catch (error) {
                showMessage("Error loading tasks: " + error.message);
            }
        }

        async function createTask() {
            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const userId = document.getElementById("userId").value;

            if (!title || !description || !userId) {
                showMessage("Enter a title, description, and assigned user.");
                return;
            }

            try {
                const response = await fetch("/api/tasks/create", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        user_id: Number(userId)
                    })
                });

                const result = await response.json();
                showMessage(result.message || result.error);

                if (response.ok) {
                    document.getElementById("title").value = "";
                    document.getElementById("description").value = "";
                    await loadTasks();
                }
            } catch (error) {
                showMessage("Could not create task: " + error.message);
            }
        }

        async function updateTask(id, oldTitle, oldDescription, oldStatus) {
            const newTitle = prompt("Enter the new task title:", oldTitle);
            if (newTitle === null) return;

            const newDescription = prompt("Enter the new task description:", oldDescription);
            if (newDescription === null) return;

            const newStatus = prompt(
                "Enter status (TODO, IN_PROGRESS, or DONE):",
                oldStatus
            );
            if (newStatus === null) return;

            try {
                const response = await fetch("/api/tasks/update", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: id,
                        title: newTitle,
                        description: newDescription,
                        status: newStatus
                    })
                });

                const result = await response.json();
                showMessage(result.message || result.error);

                if (response.ok) {
                    await loadTasks();
                }
            } catch (error) {
                showMessage("Could not update task: " + error.message);
            }
        }

        async function deleteTask(id) {
            if (!confirm("Are you sure you want to delete this task?")) {
                return;
            }

            try {
                const response = await fetch("/api/tasks/delete", {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ id: id })
                });

                const result = await response.json();
                showMessage(result.message || result.error);

                if (response.ok) {
                    await loadTasks();
                }
            } catch (error) {
                showMessage("Could not delete task: " + error.message);
            }
        }

        function showMessage(message) {
            document.getElementById("message").textContent = message;
        }

        async function startApp() {
            await loadUsers();
            await loadTasks();
        }

        startApp();
    </script>
</body>
</html>
